name: bit_math
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.1+9

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.37.0
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  google_mobile_ads: ^8.0.0
  #provider: ^6.1.2
  # firebase_core: ^2.30.1
  # cloud_firestore: ^4.17.2
  # device_info_plus: ^10.1.0
  connectivity_plus: ^7.1.1
  flutter_launcher_icons: ^0.14.4
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+10
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  riverpod: ^3.2.1
  flame_riverpod: ^5.5.4
  fluttertoast: ^9.0.0
  in_app_review: ^2.0.11
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_sound: ^9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    - family: DSEG
      fonts:
        - asset: assets/fonts/DSEG7Classic-Regular.ttf
    - family: Jersey 15
      fonts:
        - asset: assets/fonts/Jersey15-Regular.ttf
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf

flutter_icons:
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "assets/icons/icon_bg.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"