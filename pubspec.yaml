name: bit_math
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: '>=3.4.0-190.1.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  shared_preferences: ^2.2.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  google_mobile_ads: ^5.0.0
  provider: ^6.1.2
  firebase_core: ^2.30.1
  cloud_firestore: ^4.17.2
  device_info_plus: ^10.1.0
  flame_audio: ^2.10.1
  connectivity_plus: ^6.0.3
  flutter_launcher_icons: ^0.13.1
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    - family: DSEG
      fonts:
        - asset: assets/fonts/DSEG7Classic-Regular.ttf
    - family: Jersey 15
      fonts:
        - asset: assets/fonts/Jersey15-Regular.ttf
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf

flutter_icons:
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "assets/icons/icon_bg.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"